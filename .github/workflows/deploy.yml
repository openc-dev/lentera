name: Deploy to Vercel Production

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: lentera-frontend
      - run: npx vercel --prod --yes --scope mu-adz-hudzaifah-s-projects --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: lentera-frontend
