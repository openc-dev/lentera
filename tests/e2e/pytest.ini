[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -ra
markers =
    guard: Access-control & session guard tests (no data mutation)
    bva: Boundary Value Analysis cases from @audit/specs/validation_rules.md
    api: HTTP status contract tests
    known_bug: Documents a confirmed spec violation (expected to expose a defect)
log_cli = true
log_cli_level = INFO
